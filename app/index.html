<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>AshOS TV</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <!-- PASSE DE ENTRADA VIP -->
  <div class="gate-overlay" id="gateOverlay" hidden>
    <div class="gate-card">
      <div class="gate-logo-row">
        <div class="brand-mark">
          <svg width="26" height="26" viewBox="0 0 64 64" fill="none">
            <path d="M29.2 11L13.5 51H22.4L26.8 39.2L33.4 35.1L27.9 24.4L31.4 15.2L29.2 11Z" fill="#FFFFFF"/>
            <path d="M33.2 9.5L30.2 17.4L36.8 29.8L42.6 26.2L35.8 9.5H33.2Z" fill="#E2E8F0"/>
            <path d="M44.2 30.2L37.8 34.2L29.2 39.6L32.1 44.2H40.1L42.8 51H51.5L44.2 30.2Z" fill="#CBD5E1"/>
            <path d="M18 45.5L32.5 36.2L29.4 22.5L33.8 11.2" stroke="url(#fg1)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M32.5 36.2L46.5 27.4" stroke="url(#fg1)" stroke-width="2.5" stroke-linecap="round"/>
            <defs>
              <linearGradient id="fg1" x1="14" y1="50" x2="50" y2="12" gradientUnits="userSpaceOnUse">
                <stop stop-color="#38BDF8"/><stop offset="0.5" stop-color="#818CF8"/><stop offset="1" stop-color="#C084FC"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <span class="brand-name">AshOS <span style="color:#7DD3FC">TV</span></span>
      </div>
      <div><span class="gate-kicker">VOLCANIC GLASS · MULTI-SERVIDOR</span></div>
      <h1>Desbloquear AshOS TV</h1>
      <p>Informe seu código de acesso para ativar o catálogo unificado PT-BR, 196 canais ao vivo, Sagas completas e YouTube sem anúncios.</p>
      <input id="gateCodeInput" class="gate-input" type="text" maxlength="10" value="ASH7X4" placeholder="ASH7X4" data-focusable>
      <div class="gate-actions">
        <button type="button" id="gateEnterBtn" class="btn-amber" data-focusable>Entrar no AshOS TV</button>
      </div>
    </div>
  </div>

  <!-- INTERFACE PRINCIPAL ASHOS TV -->
  <div class="app-shell" id="appShell">
    <header class="topbar">
      <div class="brand-wrap">
        <div class="brand-mark">
          <svg width="24" height="24" viewBox="0 0 64 64" fill="none">
            <path d="M29.2 11L13.5 51H22.4L26.8 39.2L33.4 35.1L27.9 24.4L31.4 15.2L29.2 11Z" fill="#FFFFFF"/>
            <path d="M33.2 9.5L30.2 17.4L36.8 29.8L42.6 26.2L35.8 9.5H33.2Z" fill="#E2E8F0"/>
            <path d="M44.2 30.2L37.8 34.2L29.2 39.6L32.1 44.2H40.1L42.8 51H51.5L44.2 30.2Z" fill="#CBD5E1"/>
            <path d="M18 45.5L32.5 36.2L29.4 22.5L33.8 11.2" stroke="url(#fg2)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M32.5 36.2L46.5 27.4" stroke="url(#fg2)" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="46" cy="14.5" r="2" fill="#38BDF8"/>
            <defs>
              <linearGradient id="fg2" x1="14" y1="50" x2="50" y2="12" gradientUnits="userSpaceOnUse">
                <stop stop-color="#38BDF8"/><stop offset="0.5" stop-color="#818CF8"/><stop offset="1" stop-color="#C084FC"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <span class="brand-name">AshOS</span>
        <span class="brand-sub-tag">TV</span>
        <span class="kids-chip" id="kidsBadge" hidden>MODO KIDS</span>
      </div>

      <nav class="nav-capsule" aria-label="Categorias principais">
        <button type="button" class="nav-tab is-active" data-tab="inicio" data-focusable>Início</button>
        <button type="button" class="nav-tab" data-tab="filmes" data-focusable>Filmes</button>
        <button type="button" class="nav-tab" data-tab="series" data-focusable>Séries</button>
        <button type="button" class="nav-tab" data-tab="desenhos" data-focusable>Desenhos</button>
        <button type="button" class="nav-tab" data-tab="sagas" data-focusable>Sagas</button>
        <button type="button" class="nav-tab" data-tab="aovivo" data-focusable>Ao vivo</button>
        <button type="button" class="nav-tab" data-tab="minhalista" data-focusable>Minha lista</button>
      </nav>

      <div class="top-actions">
        <button type="button" class="circle-btn" id="searchToggleBtn" aria-label="Buscar" data-focusable>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <circle cx="11" cy="11" r="6.8" stroke="currentColor" stroke-width="2.1"/>
            <path d="M16.2 16.2L20.5 20.5" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/>
          </svg>
        </button>
        <button type="button" class="dots-btn" id="dotsMenuBtn" aria-label="Mais opções" data-focusable>•••</button>
        <button type="button" class="avatar-btn" id="avatarMenuBtn" aria-label="Perfil e YouTube" data-focusable>
          <span class="avatar-inner" id="avatarLetter">A</span>
        </button>
      </div>
    </header>

    <!-- BARRA DE BUSCA -->
    <div class="search-bar-box" id="searchBox" hidden>
      <input type="search" id="searchInput" class="search-input" placeholder="Buscar em Cinemeta, AnimesFHD, Brazuca, Torrentio ou 196 canais..." data-focusable>
      <button type="button" id="searchClearBtn" class="btn-subtle" data-focusable>Fechar</button>
    </div>

    <!-- CONTEÚDO DINÂMICO -->
    <main id="mainStage"></main>
  </div>

  <!-- TELA DE DETALHES DO TÍTULO -->
  <section class="detail-view" id="detailView" hidden>
    <img class="detail-bg" id="detailBg" src="" alt="">
    <div class="detail-vignette"></div>
    <div class="detail-hero">
      <div class="detail-top">
        <button type="button" class="detail-btn-glass" id="detailBackBtn" data-focusable>← Voltar ao catálogo</button>
        <span class="d-chip d-chip-pt" id="detailPlatformChip">Multi-Servidor PT-BR Ativo</span>
      </div>
      <div class="detail-main" id="detailMain"></div>
    </div>
  </section>

  <!-- DRAWER DE PERFIL, YOUTUBE SEM ANÚNCIOS, SERVIDORES & DIAGNÓSTICO -->
  <div class="drawer-backdrop" id="drawerBackdrop" hidden>
    <aside class="profile-drawer" id="profileDrawer">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
        <strong style="font-size:18px">Perfis &amp; Servidores</strong>
        <button type="button" class="btn-subtle" id="drawerCloseBtn" style="padding:7px 14px" data-focusable>✕ Fechar</button>
      </div>

      <div class="profiles-row" id="profilesRow"></div>

      <button type="button" class="menu-item-btn menu-item-yt" id="openYoutubeBtn" data-focusable>
        <span>▶ YouTube + SponsorBlock</span>
        <span class="yt-free-pill">ZERO ANÚNCIOS</span>
      </button>

      <button type="button" class="menu-item-btn" id="serversInfoBtn" data-focusable>
        <span>🛰️ Cluster de Servidores Integrados</span>
        <span style="color:#7DD3FC;font-size:12px">8 Ativos</span>
      </button>

      <button type="button" class="menu-item-btn" id="addSourceBtn" data-focusable>
        <span>＋ Adicionar Addon Stremio / M3U</span>
        <span style="color:#C084FC;font-size:12px">Importar</span>
      </button>

      <button type="button" class="menu-item-btn" id="remoteInfoBtn" data-focusable>
        <span>📱 Celular vira Controle Remoto</span>
        <span style="color:var(--green);font-size:12px" id="lanTag">Ativo na rede</span>
      </button>

      <button type="button" class="menu-item-btn" id="diagBtn" data-focusable>
        <span>⚡ Teste em 1 Clique (Servidores &amp; Player)</span>
        <span style="color:var(--text-muted);font-size:12px" id="diagStatus">Testar</span>
      </button>

      <div id="drawerPanelExtra" style="margin-top:6px"></div>
    </aside>
  </div>

  <!-- FALLBACK WEB PLAYER (WINDOWS / WEB) -->
  <div class="web-player-modal" id="webPlayerModal" hidden>
    <div class="web-player-top">
      <strong id="webPlayerTitle">AshOS Cinema</strong>
      <div style="display:flex;gap:8px;align-items:center">
        <button type="button" class="btn-subtle" id="webSpeedBtn" data-focusable>1.0×</button>
        <button type="button" class="btn-amber" id="webPlayerCloseBtn" style="padding:8px 18px" data-focusable>✕ Sair</button>
      </div>
    </div>
    <video id="webVideo" controls playsinline></video>
  </div>

  <div class="toast-msg" id="toastMsg" hidden></div>

  <script src="catalog_seed.js"></script>
  <script src="feeds_bundle.js"></script>
  <script src="app.js"></script>
</body>
</html>
